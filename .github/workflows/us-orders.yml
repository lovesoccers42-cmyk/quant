name: 월간 주문서 (미국)

# 주문서만 만듭니다. 내 데이터(체결·보유·자금)를 바꾸는 입력은 없습니다 —
# 그건 '데이터 관리' 워크플로(manage.yml)가 합니다.
#
# 운용 순서
#   매월 1일 저녁  이 워크플로가 주문서를 만듭니다 (직전 미국 종가 기준)
#   매월 2일 밤    미국장에서 주문서대로 체결 (한국 시간 밤 = 미국 낮)
#   체결 뒤        manage.yml이 inbox의 CSV로 데이터를 갱신
#                  (holdings_us_main_*.csv · fills_us_alt_*.csv 처럼
#                   파일 이름에 'us'를 넣어야 미국으로 들어갑니다)
#
# 주기: 월 1회 리밸런싱 + 1등분입니다. 한 종목이 한 달에 한 번 점검되고,
# 이게 한국(주 1회 × 4등분 = 4주마다)과 같은 리듬입니다. 11년 백테스트로
# 4등분(4개월 주기)과 견줘 봤는데 비용차감 수익은 같고(13.28% vs 13.35%)
# 턴오버만 66% → 88%로 올랐습니다 — 사실상 공짜라 1등분으로 갑니다.
#
# 금액이 있는 파일(보유 상태·원장·주문서)은 **비공개 레포**에 둡니다.
# 공개 릴리스에는 금액 없는 모델 명단만 올립니다.

on:
  schedule:
    # 02:00 UTC 1일 = 11:00 KST. GitHub가 예약을 6~9시간 미루므로(실측)
    # 늦어도 1일 저녁에는 끝나, 2일 밤 미국장 거래에 쓸 수 있습니다.
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      tranches:
        description: "등분 수 — 1이 기본(한 달에 전체 점검). 바꾸면 백테스트와 다른 전략이 됩니다"
        required: false
        default: "1"
      profile:
        description: "계좌 — main(상수) / alt(배우자). run_both=0일 때만 의미 있습니다"
        required: false
        default: "main"
        type: choice
        options: ["main", "alt"]
      run_both:
        description: "두 계좌 주문서를 모두 만들지 (1=둘 다, 0=profile만)"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]

concurrency:
  group: quant-us-orders
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  us-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - name: 비공개 상태 레포 설정 확인
        env:
          TOK: ${{ secrets.STATE_TOKEN }}
        run: |
          if [ -z "${{ vars.STATE_REPO }}" ]; then
            echo "::error::STATE_REPO 변수가 없습니다. Settings > Secrets and variables > Actions > Variables 에 'owner/quant-state' 형태로 넣으세요."
            exit 1
          fi
          if [ -z "$TOK" ]; then
            echo "::error::STATE_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi
          echo "상태 레포: ${{ vars.STATE_REPO }}"

      - name: 비공개 상태 레포 가져오기
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO }}
          token: ${{ secrets.STATE_TOKEN }}
          path: state-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 공개 데이터 내려받기 (주가·재무·밸류·종목)
        run: |
          mkdir -p data output
          gh release download data-store -D data \
            -p 'global_price.parquet' -p 'global_ticker.parquet' \
            -p 'global_fs.parquet' -p 'global_value.parquet' --clobber \
            || echo "::warning::공개 데이터 일부를 못 받았습니다 — 미국 월간 실행을 확인하세요."
          ls -lh data || true

      - name: 보유 상태 가져오기 (없으면 중단)
        run: |
          # 상태 파일이 없으면 주문서가 '첫 실행'으로 나와 **이미 보유한
          # 종목을 처음부터 다시 100종목 사라고** 합니다. 그건 사고이므로
          # 조용히 넘어가지 않고 멈춥니다.
          if [ ! -f state-repo/state/us_portfolio.parquet ]; then
            echo "::error::state-repo/state/us_portfolio.parquet 가 없습니다. 보유 CSV(holdings_us_main_*.csv)를 inbox에 올리고 '데이터 관리'를 먼저 돌리세요. 지금 주문서를 만들면 첫 실행으로 오인해 전량 재매수 주문이 나옵니다."
            exit 1
          fi
          cp -v state-repo/state/*.parquet data/
          python -c "
          import portfolio, config
          portfolio.set_market('us')
          for key in config.PROFILES:
              p = config.profile(key, market='us')
              st = portfolio.load_state(p['state_table'])
              cap = portfolio.load_capital(p['capital_table'])
              print(f\"  {key}: 보유 {len(st)}종목 · 운용기준 \${float(cap.get('운용기준') or 0):,.2f}\"
                    + (f\" · {cap['램프']}\" if cap.get('램프') else ''))
          "

      - name: 주가가 얼마나 묵었는지
        run: |
          # 주문 수량과 순위가 전부 '마지막 종가'에서 나옵니다. 주가가
          # 일주일 묵었으면 그 주문서로 거래하면 안 됩니다.
          python -c "
          import pandas as pd, store
          d = store.read_sql('select max(Date) as d from global_price;')
          last = pd.Timestamp(d['d'].iloc[0])
          age = (pd.Timestamp.now(tz='Asia/Seoul').tz_localize(None).normalize()
                 - last.normalize()).days
          print(f'  미국 주가 마지막 거래일 {last:%Y-%m-%d} ({age}일 전)')
          if age > 5:
              print(f'::warning::주가가 {age}일 묵었습니다 — 미국 일간 실행을 먼저 돌리세요.')
          "

      - name: 오프라인 점검 (커밋 누락 잡기)
        run: |
          python tools/test_portfolio.py
          python tools/test_us_portfolio.py
          python tools/test_us_orders.py
          python tools/test_perf.py
          python tools/test_ttm.py

      - name: 월간 주문서 만들기
        env:
          TR: ${{ github.event.inputs.tranches || '1' }}
          PROFILE: ${{ github.event.inputs.profile || 'main' }}
          BOTH: ${{ github.event.inputs.run_both || '1' }}
        run: |
          # 한쪽이 실패해도 다른 쪽 주문서는 나와야 하므로 결과를 모아 판정합니다.
          fail=0
          if [ "$BOTH" = "1" ]; then
            targets="main alt"
          else
            targets="$PROFILE"
          fi
          for prof in $targets; do
            echo "::group::$prof 미국 주문서"
            if python run_us_monthly_orders.py -p "$prof" "$TR"; then
              echo "$prof OK"
            else
              echo "::error::$prof 주문서 생성 실패"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: 상태·주문서 비공개 레포에 저장
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p state-repo/state state-repo/orders
          # 저장 목록은 코드에서 받아옵니다 — 손으로 적으면 테이블을 새로
          # 만들 때 빠뜨립니다 (2026-10-22에 미국 상태가 매 실행 사라졌습니다).
          python -c "import store; print(' '.join(store.STATE_TABLES))" \
            > /tmp/state_tables.txt
          echo "--- 저장 대상 테이블 ---"; cat /tmp/state_tables.txt
          for t in $(cat /tmp/state_tables.txt); do
            for f in data/"$t".parquet; do
              [ -f "$f" ] && cp -v "$f" state-repo/state/
            done
          done
          for f in output/*usorder-*.xlsx output/us_orders*_latest.json; do
            [ -f "$f" ] && cp -v "$f" state-repo/orders/
          done
          if [ ! -d state-repo/.git ]; then
            echo "::error::state-repo가 없습니다 — 이번 실행의 상태 변경을 저장하지 못했습니다."
            exit 1
          fi
          cd state-repo
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add -A
          git commit -m "미국 주문서 $(date +%F) (us-orders run #${{ github.run_number }})" \
            || echo "변경 없음"
          pushed=0
          for try in 1 2 3; do
            if git pull --rebase --autostash && git push; then pushed=1; break; fi
            echo "::warning::push 재시도 $try"
            sleep $((try * 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::비공개 레포에 push하지 못했습니다 — 이번 실행의 상태·원장 변경이 저장되지 않았습니다."
            exit 1
          fi

      - name: 공개 릴리스에 올리기 (금액 없는 것만)
        if: always()
        run: |
          shopt -s nullglob
          gh release view data-store >/dev/null 2>&1 ||
            gh release create data-store --title "데이터 저장소" --notes "파이프라인이 관리하는 데이터입니다. 직접 수정하지 마세요."
          # 올릴 것만 이름으로 적습니다 — 패턴으로 쓸어 담으면 금액이 든
          # 파일이 조용히 공개됩니다.
          files=(
            output/model_us_latest.parquet output/model_us_alt_latest.parquet
            output/model_us_hold.parquet output/model_us_alt_hold.parquet
          )
          for f in output/*model-us*.xlsx; do files+=("$f"); done
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            ok=0
            for try in 1 2 3; do
              if gh release upload data-store "$f" --clobber; then ok=1; break; fi
              echo "::warning::업로드 재시도 $try - $f"
              sleep $((try * 5))
            done
            [ $ok -ne 1 ] && { echo "::error::업로드 실패 - $f"; fail=1; }
          done
          exit $fail

      - name: 실행 기록 보관 (주문서는 비공개 레포에 있습니다)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-orders-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn
