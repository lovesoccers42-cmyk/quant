name: 데이터 관리 (한국 · 체결·보유 갱신)

# 주문서를 만들지 않습니다. 내 데이터만 갱신합니다.
#
# 쓰는 법 (금요일 저녁)
#   1. 비공개 레포의 inbox/ 폴더에 CSV를 드래그앤드롭으로 올립니다
#        fills_main_2026-10-16.csv    상수님 체결내역
#        fills_alt_2026-10-16.csv     배우자 체결내역
#        holdings_main.csv            상수님 보유목록 (예수금 줄 포함 가능)
#        holdings_alt.csv             배우자 보유목록
#   2. 이 워크플로를 Run workflow (입력 없이 그냥)
#   3. 처리한 파일은 archive/날짜/로 옮겨지고 inbox는 비워집니다
#
# 왜 주문서 워크플로와 분리했나: 운용 순서가 '목요일 주문서 → 금요일 낮 체결
# → 금요일 저녁 갱신'입니다. 한 워크플로에 섞어 두면 체결내역을 넣는 순간
# 새 주문서가 같이 나와(또는 그 반대로) 어느 쪽이 최신인지 헷갈립니다.

on:
  workflow_dispatch:
    inputs:
      tranches:
        description: "등분 수 (주간 4등분이면 4)"
        required: false
        default: "4"
      profile:
        description: "아래 '한 번만' 입력들이 적용될 계좌 (inbox CSV는 파일 이름으로 계좌를 구분하므로 이 값과 무관)"
        required: false
        default: "main"
        type: choice
        options: ["main", "alt"]
      seed_csv:
        description: "처음 한 번만 — 이어받을 보유 종목을 등분에 배분 (종목코드,평가금액,종목명)"
        required: false
        default: ""
      capital_krw:
        description: "약정 운용금액(원) — 계좌당 한 번. 예수금을 미리 넣지 않아도 배정액은 여기서 나옵니다. 예: 10000000"
        required: false
        default: ""
      reset_state:
        description: "보유 상태 초기화 (1). 주문서를 뽑았지만 체결하지 않은 계좌만!"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      backfill_log:
        description: "원장 백필 (1). 원장이 생기기 전 주문을 주문서 json에서 되살립니다"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      migrate:
        description: "이사 (1) — 공개 릴리스의 상태·원장·주문서를 비공개 레포로 옮기고 공개 쪽에서 삭제. 한 번만"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]

concurrency:
  group: quant-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QUANT_CAPITAL_KRW: ${{ vars.QUANT_CAPITAL_KRW || '0' }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - name: 비공개 상태 레포 설정 확인
        env:
          TOK: ${{ secrets.STATE_TOKEN }}
        run: |
          # 체크아웃이 실패하면 메시지가 "Not Found"뿐이라 이름이 틀린 건지
          # 토큰이 없는 건지 알 수 없습니다. 먼저 API로 찍어 원인을 가립니다.
          if [ -z "${{ vars.STATE_REPO }}" ]; then
            echo "::error::STATE_REPO 변수가 없습니다. Settings > Secrets and variables > Actions > Variables 에 'owner/quant-state' 형태로 넣으세요."
            exit 1
          fi
          echo "상태 레포: ${{ vars.STATE_REPO }}"
          if [ -z "$TOK" ]; then
            echo "::error::STATE_TOKEN 시크릿이 비어 있습니다. Variables가 아니라 Secrets 탭에 'STATE_TOKEN' 이름으로 넣으세요."
            exit 1
          fi
          code=$(curl -sS -o /tmp/staterepo.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOK" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ vars.STATE_REPO }}")
          echo "레포 조회 HTTP $code"
          case "$code" in
            200)
              python3 -c "import json;d=json.load(open('/tmp/staterepo.json'));print('  비공개:',d['private'],'· 기본브랜치:',d.get('default_branch'),'· 크기:',d.get('size'))"
              if [ "$(python3 -c "import json;print(json.load(open('/tmp/staterepo.json')).get('size'))")" = "0" ]; then
                echo "::warning::레포가 비어 있습니다(커밋 0개). 체크아웃이 실패하면 레포 페이지에서 'Add a README'로 첫 커밋을 만드세요."
              fi
              ;;
            401) echo "::error::토큰이 유효하지 않습니다 (만료·오타·일부만 붙여넣음)."; exit 1 ;;
            403) echo "::error::권한 거부 — 토큰의 Repository permissions에서 Contents를 'Read and write'로 주세요."; exit 1 ;;
            404) echo "::error::레포를 못 찾았습니다. 이름(${{ vars.STATE_REPO }})이 정확한지, 그리고 토큰의 'Repository access'에 그 레포가 들어 있는지 확인하세요 (Public repositories만 선택돼 있으면 비공개 레포는 404입니다)."; exit 1 ;;
            *) echo "::error::예상 못 한 응답 $code"; cat /tmp/staterepo.json | head -5; exit 1 ;;
          esac

      - name: 비공개 상태 레포 가져오기
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO }}
          token: ${{ secrets.STATE_TOKEN }}
          path: state-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 폴더 준비 · 상태 가져오기
        run: |
          mkdir -p data output state-repo/state state-repo/orders \
                   state-repo/inbox state-repo/archive
          shopt -s nullglob
          for f in state-repo/state/*.parquet; do cp -v "$f" data/; done
          ls -lh data || true

      - name: 이사 — 공개 릴리스의 민감 파일을 비공개 레포로 (migrate=1)
        if: ${{ github.event.inputs.migrate == '1' }}
        run: |
          # 금액이 들어 있는 파일을 공개 릴리스에서 내려 비공개 레포에 넣고,
          # 공개 쪽에서 지웁니다. 지우기 전에 비공개 레포 커밋이 끝나는지
          # 확인하므로, 중간에 끊겨도 자료가 사라지지는 않습니다.
          set -e
          mkdir -p migrate
          PATTERNS=(
            'kor_portfolio.parquet' 'kor_portfolio_alt.parquet'
            'kor_capital.parquet' 'kor_capital_alt.parquet'
            'kor_trades.parquet' 'kor_holdings_log.parquet'
            'weekly_kr_latest.json' 'weekly_kr_alt_latest.json'
            'weekly-main-*.xlsx' 'weekly-alt-*.xlsx'
          )
          args=()
          for p in "${PATTERNS[@]}"; do args+=(-p "$p"); done
          gh release download data-store -D migrate "${args[@]}" --clobber || true
          # 이름이 뭉개진 옛 엑셀(한글이 떨어져 MMDD_100.xlsx 하나로 합쳐진
          # 것들)도 안에 무엇이 있는지 알 수 없으니 함께 내립니다.
          gh release download data-store -D migrate -p '[0-9][0-9][0-9][0-9]_*.xlsx' --clobber || true
          echo "--- 내려받은 파일 ---"; ls -la migrate || true

          shopt -s nullglob
          moved=0
          for f in migrate/*.parquet; do cp -v "$f" state-repo/state/; moved=1; done
          for f in migrate/*.json migrate/*.xlsx; do cp -v "$f" state-repo/orders/; moved=1; done
          if [ "$moved" = "0" ]; then
            echo "::warning::공개 릴리스에서 옮길 파일이 없습니다 (이미 이사했거나 처음입니다)."
          else
            cd state-repo
            git config user.name "quant-bot"
            git config user.email "quant-bot@users.noreply.github.com"
            git add -A
            git commit -m "이사 — 공개 릴리스의 상태·원장·주문서" || echo "변경 없음"
            git pull --rebase --autostash && git push
            cd ..
            # 커밋·푸시가 끝난 뒤에만 공개 쪽에서 지웁니다.
            for f in migrate/*; do
              n=$(basename "$f")
              echo "공개 릴리스에서 삭제: $n"
              gh release delete-asset data-store "$n" -y || echo "::warning::삭제 실패 $n"
            done
          fi
          # 다음 단계가 상태를 쓰도록 data/에도 둡니다.
          for f in state-repo/state/*.parquet; do cp -v "$f" data/; done

      - name: 오프라인 점검 (커밋 누락 잡기)
        run: python tools/test_portfolio.py

      # ── 순서: 구조를 먼저, 원장 다음, inbox(체결→보유)로 마무리 ────────
      - name: 보유 상태 초기화 (체결 전에만)
        if: ${{ github.event.inputs.reset_state == '1' }}
        run: python run_weekly.py -p "${{ github.event.inputs.profile }}" reset

      - name: 보유 종목 등분 배분 (seed — 처음 한 번만)
        if: ${{ github.event.inputs.seed_csv != '' }}
        env:
          # 입력을 셸에 직접 끼워 넣지 않습니다 — 따옴표나 특수문자가 들어오면
          # 명령이 깨지고, 그보다 더 나쁜 일도 생길 수 있습니다.
          SEED_CSV: ${{ github.event.inputs.seed_csv }}
        run: |
          printf '%s\n' "$SEED_CSV" > holdings.csv
          python run_weekly.py -p "${{ github.event.inputs.profile }}" \
            seed holdings.csv "${{ github.event.inputs.tranches || '4' }}"

      - name: 운용금액 설정 (현금으로 시작할 때 한 번)
        if: ${{ github.event.inputs.capital_krw != '' }}
        env:
          CAP: ${{ github.event.inputs.capital_krw }}
        run: python run_weekly.py -p "${{ github.event.inputs.profile }}" capital "$CAP"

      - name: 원장 백필 (한 번만 · inbox보다 먼저)
        if: ${{ github.event.inputs.backfill_log == '1' }}
        run: |
          shopt -s nullglob
          for P in main alt; do
            if [ "$P" = "alt" ]; then J=weekly_kr_alt_latest.json; else J=weekly_kr_latest.json; fi
            if [ -f "state-repo/orders/$J" ]; then
              python run_weekly.py -p "$P" log "state-repo/orders/$J"
            else
              echo "::warning::state-repo/orders/$J 가 없어 $P 백필을 건너뜁니다."
            fi
          done

      - name: inbox CSV 적용 (체결 → 보유)
        run: |
          python tools/inbox_apply.py state-repo/inbox state-repo/archive \
            "${{ github.event.inputs.tranches || '4' }}"

      - name: 결과 요약 (금액 없이)
        if: always()
        continue-on-error: true
        run: python tools/manage_status.py

      - name: 비공개 레포에 저장
        if: always()
        run: |
          shopt -s nullglob
          for f in data/kor_portfolio*.parquet data/kor_capital*.parquet \
                   data/kor_trades.parquet data/kor_holdings_log.parquet; do
            [ -f "$f" ] && cp -v "$f" state-repo/state/
          done
          if [ ! -d state-repo/.git ]; then
            echo "::error::state-repo가 없습니다 — 이번 실행의 상태 변경을 저장하지 못했습니다. 위쪽 체크아웃 실패를 먼저 고치세요."
            exit 1
          fi
          cd state-repo
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add -A
          git commit -m "데이터 갱신 $(date +%F) (manage run #${{ github.run_number }})" \
            || echo "변경 없음"
          pushed=0
          for try in 1 2 3; do
            if git pull --rebase --autostash && git push; then pushed=1; break; fi
            echo "::warning::push 재시도 $try"
            sleep $((try * 5))
          done
          if [ "$pushed" != "1" ]; then
            # 여기서 조용히 넘어가면 상태 변경이 사라집니다 (실측: push 3번
            # 실패했는데 스텝은 '성공'으로 끝났습니다).
            echo "::error::비공개 레포에 push하지 못했습니다 — 이번 실행의 상태·원장 변경이 저장되지 않았습니다."
            exit 1
          fi

      - name: 공개 릴리스에 요약만 올리기
        if: always()
        run: |
          [ -f output/manage_latest.json ] || exit 0
          gh release view data-store >/dev/null 2>&1 ||
            gh release create data-store --title "데이터 저장소" --notes "파이프라인이 관리하는 데이터입니다. 직접 수정하지 마세요."
          for try in 1 2 3; do
            gh release upload data-store output/manage_latest.json --clobber && break
            echo "::warning::업로드 재시도 $try"
            sleep $((try * 5))
          done

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manage-${{ github.run_number }}
          path: |
            logs/
            output/manage_latest.json
          retention-days: 90
          if-no-files-found: warn
