name: 데이터 관리 (한국 · 체결·보유 갱신)

# 주문서를 만들지 않습니다. 내 데이터만 갱신합니다.
#
# 왜 주문서 워크플로와 분리했나: 운용 순서가 '목요일 주문서 → 금요일 낮 체결
# → 금요일 저녁 갱신'입니다. 한 워크플로에 섞어 두면 체결내역을 넣는 순간
# 새 주문서가 같이 나와(또는 그 반대로) 어느 쪽이 최신인지 헷갈리고, 입력을
# 잘못 넣으면 주문서가 틀립니다. 갱신은 갱신만, 주문서는 주문서만 합니다.
#
# 예약 실행이 없습니다 — 체결내역·보유목록을 사람이 붙여넣어야 하니까요.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "계좌 — main(상수) / alt(배우자). 아래 입력은 이 계좌에만 적용됩니다"
        required: true
        default: "main"
        type: choice
        options: ["main", "alt"]
      fills_csv:
        description: "체결내역 — 종목코드(또는 종목명) · 매매구분 · 체결수량 · 체결단가"
        required: false
        default: ""
      fills_asof:
        description: "체결내역을 적용할 주문 날짜 (YYYY-MM-DD). 비우면 가장 최근 주문서"
        required: false
        default: ""
      resync_csv:
        description: "현재 보유 목록 — 종목코드,평가금액,종목명 (매주)"
        required: false
        default: ""
      cash:
        description: "계좌에 남은 현금(원). 미매수 계획분은 자동으로 빼고 계산합니다"
        required: false
        default: "0"
      tranches:
        description: "등분 수 (주간 4등분이면 4)"
        required: false
        default: "4"
      seed_csv:
        description: "처음 한 번만 — 이어받을 보유 종목을 등분에 배분합니다"
        required: false
        default: ""
      capital_krw:
        description: "현금으로 시작할 때 한 번 — 운용금액(원). 예: 10000000"
        required: false
        default: ""
      reset_state:
        description: "보유 상태 초기화 (1). 주문서를 뽑았지만 체결하지 않은 계좌만!"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      backfill_log:
        description: "원장 백필 (1). 원장이 생기기 전 주문을 주문서 json에서 되살립니다"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]

concurrency:
  group: quant-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QUANT_SMTP_USER: ${{ secrets.QUANT_SMTP_USER }}
      QUANT_SMTP_PASS: ${{ secrets.QUANT_SMTP_PASS }}
      QUANT_REPORT_EMAIL: ${{ secrets.QUANT_REPORT_EMAIL }}
      QUANT_CAPITAL_KRW: ${{ vars.QUANT_CAPITAL_KRW || '0' }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 저장소 내려받기
        run: |
          mkdir -p data output
          gh release download data-store -D data -p 'kor_*.parquet' --clobber \
            || echo "저장소가 아직 없습니다 — 월간 실행을 먼저 돌려주세요."
          ls -lh data || true

      - name: 오프라인 점검 (커밋 누락 잡기)
        run: python tools/test_portfolio.py

      # ── 순서: 구조를 먼저, 원장 다음, 실제 보유로 마무리 ──────────
      - name: 보유 상태 초기화 (체결 전에만)
        if: ${{ github.event.inputs.reset_state == '1' }}
        run: python run_weekly.py -p "${{ github.event.inputs.profile }}" reset

      - name: 보유 종목 등분 배분 (seed — 처음 한 번만)
        if: ${{ github.event.inputs.seed_csv != '' }}
        env:
          # 입력을 셸에 직접 끼워 넣지 않습니다 — 따옴표나 특수문자가 들어오면
          # 명령이 깨지고, 그보다 더 나쁜 일도 생길 수 있습니다.
          SEED_CSV: ${{ github.event.inputs.seed_csv }}
        run: |
          printf '%s\n' "$SEED_CSV" > holdings.csv
          echo "--- 붙여넣은 보유 종목 ---"
          cat holdings.csv
          python run_weekly.py -p "${{ github.event.inputs.profile }}" \
            seed holdings.csv "${{ github.event.inputs.tranches || '4' }}"

      - name: 운용금액 설정 (현금으로 시작할 때 한 번)
        if: ${{ github.event.inputs.capital_krw != '' }}
        env:
          CAP: ${{ github.event.inputs.capital_krw }}
        run: python run_weekly.py -p "${{ github.event.inputs.profile }}" capital "$CAP"

      - name: 원장 백필 (한 번만 · 체결내역보다 먼저)
        if: ${{ github.event.inputs.backfill_log == '1' }}
        run: |
          P="${{ github.event.inputs.profile }}"
          if [ "$P" = "alt" ]; then J=weekly_kr_alt_latest.json; else J=weekly_kr_latest.json; fi
          gh release download data-store -p "$J" --clobber
          python run_weekly.py -p "$P" log "$J"

      - name: 체결내역 반영
        if: ${{ github.event.inputs.fills_csv != '' }}
        env:
          FILLS_CSV: ${{ github.event.inputs.fills_csv }}
          FILLS_ASOF: ${{ github.event.inputs.fills_asof }}
        run: |
          printf '%s\n' "$FILLS_CSV" > fills.csv
          echo "--- 붙여넣은 체결내역 ---"
          cat fills.csv
          python run_weekly.py -p "${{ github.event.inputs.profile }}" \
            fills fills.csv "${FILLS_ASOF:--}"

      - name: 보유·자금 재동기화 (매주 · 맨 마지막)
        if: ${{ github.event.inputs.resync_csv != '' }}
        env:
          RESYNC_CSV: ${{ github.event.inputs.resync_csv }}
          CASH: ${{ github.event.inputs.cash || '0' }}
        run: |
          printf '%s\n' "$RESYNC_CSV" > resync.csv
          echo "--- 붙여넣은 보유 목록 ---"
          cat resync.csv
          python run_weekly.py -p "${{ github.event.inputs.profile }}" \
            resync resync.csv "$CASH" "${{ github.event.inputs.tranches || '4' }}"

      - name: 결과 요약 (금액 없이)
        if: always()
        run: python tools/manage_status.py

      - name: 저장소·결과 올리기
        if: always()
        run: |
          shopt -s nullglob
          gh release view data-store >/dev/null 2>&1 ||
            gh release create data-store --title "데이터 저장소" --notes "파이프라인이 관리하는 데이터입니다. 직접 수정하지 마세요."

          files=(data/kor_*.parquet output/manage_latest.json)
          echo "--- 올릴 파일 ${#files[@]}개 ---"
          for f in "${files[@]}"; do echo "  $f"; done

          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            ok=0
            for try in 1 2 3; do
              if gh release upload data-store "$f" --clobber; then ok=1; break; fi
              echo "::warning::업로드 재시도 $try - $f"
              sleep $((try * 5))
            done
            if [ $ok -ne 1 ]; then
              echo "::error::업로드 실패 - $f"
              fail=1
            fi
          done
          exit $fail

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manage-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 90
          if-no-files-found: warn
