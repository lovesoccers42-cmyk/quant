name: 일간 실행

on:
  schedule:
    # 07:30 UTC = 16:30 KST, 평일 (장 마감 후)
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: "테스트용 종목 수 제한 (0 = 전체)"
        required: false
        default: "0"
      price_workers:
        description: "주가 수집 동시 요청 수 (차단되면 낮추세요)"
        required: false
        default: "6"

concurrency:
  group: quant-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      QUANT_SMTP_USER: ${{ secrets.QUANT_SMTP_USER }}
      QUANT_SMTP_PASS: ${{ secrets.QUANT_SMTP_PASS }}
      QUANT_REPORT_EMAIL: ${{ secrets.QUANT_REPORT_EMAIL }}
      QUANT_TG_TOKEN: ${{ secrets.QUANT_TG_TOKEN }}
      QUANT_TG_CHAT_ID: ${{ secrets.QUANT_TG_CHAT_ID }}
      QUANT_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit || '0' }}
      QUANT_PRICE_WORKERS: ${{ github.event.inputs.price_workers || '6' }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 저장소 내려받기
        run: |
          mkdir -p data output
          gh release download data-store -D data -p 'kor_*.parquet' --clobber \
            || echo "저장소가 아직 없습니다 — 월간 실행을 먼저 돌려주세요."
          ls -lh data || true

      - name: 일간 파이프라인 실행
        run: python run_daily.py

      - name: 저장소·결과 올리기
        if: always()
        run: |
          shopt -s nullglob
          echo "--- output 폴더 내용 ---"
          ls -la output 2>/dev/null || echo "(output 폴더 없음)"

          gh release view data-store >/dev/null 2>&1 ||
            gh release create data-store --title "데이터 저장소" --notes "파이프라인이 관리하는 데이터입니다. 직접 수정하지 마세요."

          # data/ 는 한국·미국이 공유하므로 자기 시장 파일만.
          # output/ 는 이 실행이 만든 결과만 들어 있으므로 통째로 올린다.
          # (파일명 패턴에 의존하면 이름을 바꿀 때마다 조용히 누락된다)
          files=(data/kor_*.parquet output/*)

          echo "--- 올릴 파일 ${#files[@]}개 ---"
          for f in "${files[@]}"; do echo "  $f"; done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::올릴 파일이 하나도 없습니다"
          fi

          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            ok=0
            for try in 1 2 3; do
              if gh release upload data-store "$f" --clobber; then ok=1; break; fi
              echo "::warning::업로드 재시도 $try - $f"
              sleep $((try * 5))
            done
            if [ $ok -ne 1 ]; then
              echo "::error::업로드 실패 - $f"
              fail=1
            fi
          done

          echo "--- 릴리스에 현재 올라가 있는 파일 ---"
          gh release view data-store --json assets --jq '.assets[].name' || true
          exit $fail

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 30
          if-no-files-found: warn
