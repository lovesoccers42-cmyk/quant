name: 주간 주문서 (한국)

# 주문서만 만듭니다. 내 데이터(체결·보유·자금)를 바꾸는 입력은 없습니다 —
# 그건 '데이터 관리' 워크플로(manage.yml)가 합니다.
#
# 운용 순서
#   목요일 저녁  이 워크플로가 주문서를 만듭니다 (목요일 종가 기준)
#   금요일 낮    주문서대로 체결
#   금요일 저녁  manage.yml이 inbox의 CSV로 데이터를 갱신
#
# 왜 목요일인가: GitHub가 예약 실행을 6~9시간씩 미뤄서(실측) 지정 시각에
# 돌지 않습니다. 목요일 장 마감 뒤로 걸어 두면 늦어도 금요일 새벽에는 끝나
# 금요일 낮에 거래할 수 있습니다. 백테스트는 주 1회(W-FRI) 리밸런싱이고,
# 목요일 종가로 뽑아 금요일에 체결하는 것이 그 간격을 가장 가깝게 지킵니다.
#
# 금액이 있는 파일(보유 상태·원장·주문서)은 **비공개 레포**에 둡니다.
# 공개 릴리스에는 금액 없는 요약(weekly_status.json)만 올립니다.

on:
  schedule:
    # 06:40 UTC = 15:40 KST, 목요일 (장 마감 15:30 직후)
    - cron: "40 6 * * 4"
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: "테스트용 종목 수 제한 (0 = 전체)"
        required: false
        default: "0"
      price_workers:
        description: "주가 수집 동시 요청 수 (차단되면 낮추세요)"
        required: false
        default: "6"
      tranches:
        description: "등분 수 (주간 4등분이면 4)"
        required: false
        default: "4"
      profile:
        description: "계좌 — main(상수) / alt(배우자). run_both=0일 때만 의미 있습니다"
        required: false
        default: "main"
        type: choice
        options: ["main", "alt"]
      run_both:
        description: "두 계좌 주문서를 모두 만들지 (1=둘 다, 0=profile만)"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]

concurrency:
  group: quant-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      QUANT_SMTP_USER: ${{ secrets.QUANT_SMTP_USER }}
      QUANT_SMTP_PASS: ${{ secrets.QUANT_SMTP_PASS }}
      QUANT_REPORT_EMAIL: ${{ secrets.QUANT_REPORT_EMAIL }}
      QUANT_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit || '0' }}
      QUANT_PRICE_WORKERS: ${{ github.event.inputs.price_workers || '6' }}
      # 총 운용금액 폴백 — 비공개 레포의 자본 기록이 있으면 그 값을 씁니다.
      QUANT_CAPITAL_KRW: ${{ vars.QUANT_CAPITAL_KRW || '0' }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - name: 비공개 상태 레포 설정 확인
        run: |
          if [ -z "${{ vars.STATE_REPO }}" ]; then
            echo "::error::STATE_REPO 변수가 없습니다. Settings > Secrets and variables > Actions > Variables 에 'owner/quant-state' 형태로 넣으세요."
            exit 1
          fi
          echo "상태 레포: ${{ vars.STATE_REPO }}"

      - name: 비공개 상태 레포 가져오기
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO }}
          token: ${{ secrets.STATE_TOKEN }}
          path: state-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 공개 데이터 내려받기 (주가·재무·모델)
        run: |
          mkdir -p data output
          gh release download data-store -D data -p 'kor_price.parquet' -p 'kor_ticker.parquet' \
            -p 'kor_sector.parquet' -p 'kor_fs.parquet' -p 'kor_value.parquet' \
            -p 'kor_dart_*.parquet' --clobber \
            || echo "::warning::공개 데이터 일부를 못 받았습니다 — 월간 실행을 확인하세요."
          ls -lh data || true

      - name: 보유 상태 가져오기 (없으면 중단)
        run: |
          # 상태 파일이 없으면 주문서가 '첫 실행'으로 나와 **이미 보유한
          # 종목을 처음부터 다시 100종목 사라고** 합니다. 그건 사고이므로
          # 조용히 넘어가지 않고 멈춥니다.
          if [ ! -f state-repo/state/kor_portfolio.parquet ]; then
            echo "::error::state-repo/state/kor_portfolio.parquet 가 없습니다. 비공개 레포로 상태 이사(manage.yml의 migrate=1)를 먼저 돌리세요. 지금 주문서를 만들면 첫 실행으로 오인해 전량 재매수 주문이 나옵니다."
            exit 1
          fi
          cp -v state-repo/state/*.parquet data/
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          import portfolio, config
          for key in config.PROFILES:
              p = config.profile(key)
              st = portfolio.load_state(p["state_table"])
              print(f"  {key}: 상태 {len(st)}행")
          PY

      - name: 오프라인 점검 (커밋 누락 잡기)
        run: python tools/test_portfolio.py

      - name: 최신 주가 받기 (일간 실행과의 순서에 의존하지 않도록)
        continue-on-error: true
        run: python tools/refresh_kr.py

      - name: 주간 주문서 만들기
        env:
          TR: ${{ github.event.inputs.tranches || '4' }}
          PROFILE: ${{ github.event.inputs.profile || 'main' }}
          BOTH: ${{ github.event.inputs.run_both || '1' }}
        run: |
          # 두 계좌는 상태 테이블·모델 파일이 분리돼 있어 순서대로 돌리면 됩니다.
          # 한쪽이 실패해도 다른 쪽 주문서는 나와야 하므로 결과를 모아 판정합니다.
          fail=0
          if [ "$BOTH" = "1" ]; then
            targets="main alt"
          else
            targets="$PROFILE"
          fi
          for prof in $targets; do
            echo "::group::$prof 주문서"
            if python run_weekly.py -p "$prof" "$TR"; then
              echo "$prof OK"
            else
              echo "::error::$prof 주문서 생성 실패"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: 금액 없는 요약 만들기 (공개용)
        if: always()
        run: python tools/weekly_status.py

      - name: 상태·주문서 비공개 레포에 저장
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p state-repo/state state-repo/orders
          for f in data/kor_portfolio*.parquet data/kor_capital*.parquet \
                   data/kor_trades.parquet data/kor_holdings_log.parquet; do
            [ -f "$f" ] && cp -v "$f" state-repo/state/
          done
          for f in output/*weekly-*.xlsx output/weekly_kr*_latest.json; do
            [ -f "$f" ] && cp -v "$f" state-repo/orders/
          done
          cd state-repo
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add -A
          git commit -m "주문서 $(date +%F) (weekly run #${{ github.run_number }})" \
            || echo "변경 없음"
          for try in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "::warning::push 재시도 $try"
            sleep $((try * 5))
          done

      - name: 공개 릴리스에 올리기 (금액 없는 것만)
        if: always()
        run: |
          shopt -s nullglob
          gh release view data-store >/dev/null 2>&1 ||
            gh release create data-store --title "데이터 저장소" --notes "파이프라인이 관리하는 데이터입니다. 직접 수정하지 마세요."

          # 금액이 들어 있는 파일(보유 상태·원장·주문서)은 올리지 않습니다.
          # 올릴 것만 이름으로 적습니다 — 패턴으로 쓸어 담으면 새 파일이
          # 조용히 공개됩니다.
          files=(
            data/kor_price.parquet data/kor_ticker.parquet data/kor_sector.parquet
            data/kor_fs.parquet data/kor_value.parquet
            output/model_kr_latest.parquet output/model_kr_alt_latest.parquet
            output/model_kr_hold.parquet output/model_kr_alt_hold.parquet
            output/weekly_status.json
          )
          for f in output/*model-kr*.xlsx; do files+=("$f"); done

          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            ok=0
            for try in 1 2 3; do
              if gh release upload data-store "$f" --clobber; then ok=1; break; fi
              echo "::warning::업로드 재시도 $try - $f"
              sleep $((try * 5))
            done
            if [ $ok -ne 1 ]; then
              echo "::error::업로드 실패 - $f"
              fail=1
            fi
          done
          exit $fail

      - name: 실행 기록 보관 (주문서는 비공개 레포에 있습니다)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_number }}
          path: |
            logs/
            output/weekly_status.json
          retention-days: 30
          if-no-files-found: warn
