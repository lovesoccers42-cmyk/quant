name: 주간 분할 리밸런싱 (한국)

on:
  schedule:
    # 07:30 UTC = 16:30 KST, 금요일 (주간 리밸런싱)
    - cron: "30 7 * * 5"
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: "테스트용 종목 수 제한 (0 = 전체)"
        required: false
        default: "0"
      price_workers:
        description: "주가 수집 동시 요청 수 (차단되면 낮추세요)"
        required: false
        default: "6"
      seed_csv:
        description: "처음 한 번만 — 보유 종목 CSV를 그대로 붙여넣으세요 (종목코드,평가금액,종목명)"
        required: false
        default: ""
      resync_csv:
        description: "월 1회 — 지금 보유 목록을 붙여넣으면 평가액·기준금액·총자본을 다시 맞춥니다"
        required: false
        default: ""
      cash:
        description: "투입 대기 현금(원). 수익 재투자분·추가 입금. 4주에 나눠 들어갑니다"
        required: false
        default: "0"
      reset_state:
        description: "보유 상태 초기화 (1=초기화). 주문서를 뽑았지만 아직 체결하지 않은 계좌만!"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      capital_krw:
        description: "현금으로 처음 시작할 때만 — 운용금액(원). 예: 10000000. 비우면 건너뜁니다"
        required: false
        default: ""
      tranches:
        description: "등분 수 (주간 4등분이면 4)"
        required: false
        default: "4"
      profile:
        description: "계좌 — main(상수) / alt(배우자). seed·resync는 이 계좌에만 적용됩니다"
        required: false
        default: "main"
        type: choice
        options: ["main", "alt"]
      run_both:
        description: "자동 실행 때 두 계좌 주문서를 모두 만들지 (1=둘 다, 0=profile만)"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]

concurrency:
  group: quant-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      QUANT_SMTP_USER: ${{ secrets.QUANT_SMTP_USER }}
      QUANT_SMTP_PASS: ${{ secrets.QUANT_SMTP_PASS }}
      QUANT_REPORT_EMAIL: ${{ secrets.QUANT_REPORT_EMAIL }}
      QUANT_TG_TOKEN: ${{ secrets.QUANT_TG_TOKEN }}
      QUANT_TG_CHAT_ID: ${{ secrets.QUANT_TG_CHAT_ID }}
      QUANT_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit || '0' }}
      QUANT_PRICE_WORKERS: ${{ github.event.inputs.price_workers || '6' }}
      # 총 운용금액 — 주문서에 '몇 주 살지'를 적는 데 씁니다.
      # 설정 > Secrets and variables > Actions > Variables 에 숫자만 넣으세요.
      # 비워 두면 수량 칸이 빈 주문서가 나옵니다.
      QUANT_CAPITAL_KRW: ${{ vars.QUANT_CAPITAL_KRW || '0' }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 저장소 내려받기
        run: |
          mkdir -p data output
          gh release download data-store -D data -p 'kor_*.parquet' --clobber \
            || echo "저장소가 아직 없습니다 — 월간 실행을 먼저 돌려주세요."
          ls -lh data || true

      - name: 오프라인 점검 (커밋 누락 잡기)
        run: python tools/test_portfolio.py

      - name: 보유 종목 등분 배분 (seed — 처음 한 번만)
        if: ${{ github.event.inputs.seed_csv != '' }}
        env:
          # 입력을 셸에 직접 끼워 넣지 않습니다 — 따옴표나 특수문자가
          # 들어오면 명령이 깨지고, 그보다 더 나쁜 일도 생길 수 있습니다.
          SEED_CSV: ${{ github.event.inputs.seed_csv }}
        run: |
          printf '%s\n' "$SEED_CSV" > holdings.csv
          echo "--- 붙여넣은 보유 종목 ---"
          cat holdings.csv
          python run_weekly.py -p "${{ github.event.inputs.profile || 'main' }}" \
            seed holdings.csv "${{ github.event.inputs.tranches || '4' }}"

      - name: 보유·자금 재동기화 (월 1회)
        if: ${{ github.event.inputs.resync_csv != '' }}
        env:
          RESYNC_CSV: ${{ github.event.inputs.resync_csv }}
          CASH: ${{ github.event.inputs.cash || '0' }}
        run: |
          printf '%s\n' "$RESYNC_CSV" > resync.csv
          echo "--- 붙여넣은 보유 목록 ---"
          cat resync.csv
          python run_weekly.py -p "${{ github.event.inputs.profile || 'main' }}" \
            resync resync.csv "$CASH" "${{ github.event.inputs.tranches || '4' }}"

      - name: 보유 상태 초기화 (체결 전에만)
        if: ${{ github.event.inputs.reset_state == '1' }}
        run: |
          python run_weekly.py -p "${{ github.event.inputs.profile || 'main' }}" \
            reset

      - name: 운용금액 설정 (현금으로 시작할 때 한 번)
        if: ${{ github.event.inputs.capital_krw != '' }}
        env:
          CAP: ${{ github.event.inputs.capital_krw }}
        run: |
          python run_weekly.py -p "${{ github.event.inputs.profile || 'main' }}" \
            capital "$CAP"

      - name: 최신 주가 받기 (일간 실행과의 순서에 의존하지 않도록)
        continue-on-error: true
        run: python tools/refresh_kr.py

      - name: 주간 주문서 만들기
        env:
          TR: ${{ github.event.inputs.tranches || '4' }}
          PROFILE: ${{ github.event.inputs.profile || 'main' }}
          BOTH: ${{ github.event.inputs.run_both || '1' }}
        run: |
          # 두 계좌는 상태 테이블·모델 파일이 분리돼 있어 순서대로 돌리면 됩니다.
          # 한쪽이 실패해도 다른 쪽 주문서는 나와야 하므로 결과를 모아 판정합니다.
          fail=0
          if [ "$BOTH" = "1" ]; then
            targets="main alt"
          else
            targets="$PROFILE"
          fi
          for prof in $targets; do
            echo "::group::$prof 주문서"
            if python run_weekly.py -p "$prof" "$TR"; then
              echo "$prof OK"
            else
              echo "::error::$prof 주문서 생성 실패"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: 저장소·결과 올리기
        if: always()
        run: |
          shopt -s nullglob
          echo "--- output 폴더 내용 ---"
          ls -la output 2>/dev/null || echo "(output 폴더 없음)"

          gh release view data-store >/dev/null 2>&1 ||
            gh release create data-store --title "데이터 저장소" --notes "파이프라인이 관리하는 데이터입니다. 직접 수정하지 마세요."

          # data/ 는 한국·미국이 공유하므로 자기 시장 파일만.
          # output/ 는 이 실행이 만든 결과만 들어 있으므로 통째로 올린다.
          # (파일명 패턴에 의존하면 이름을 바꿀 때마다 조용히 누락된다)
          files=(data/kor_*.parquet output/*)

          echo "--- 올릴 파일 ${#files[@]}개 ---"
          for f in "${files[@]}"; do echo "  $f"; done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::올릴 파일이 하나도 없습니다"
          fi

          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            ok=0
            for try in 1 2 3; do
              if gh release upload data-store "$f" --clobber; then ok=1; break; fi
              echo "::warning::업로드 재시도 $try - $f"
              sleep $((try * 5))
            done
            if [ $ok -ne 1 ]; then
              echo "::error::업로드 실패 - $f"
              fail=1
            fi
          done

          echo "--- 릴리스에 현재 올라가 있는 파일 ---"
          gh release view data-store --json assets --jq '.assets[].name' || true
          exit $fail

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 30
          if-no-files-found: warn
