name: 주간 주문서 (한국)

# 주문서만 만듭니다. 내 데이터(체결·보유·자금)를 바꾸는 입력은 없습니다 —
# 그건 '데이터 관리' 워크플로(manage.yml)가 합니다.
#
# 운용 순서
#   목요일 저녁  이 워크플로가 주문서를 만듭니다 (목요일 종가 기준)
#   금요일 낮    주문서대로 체결
#   금요일 저녁  manage.yml에 체결내역·보유목록·현금을 넣어 데이터 갱신
#
# 왜 목요일인가: GitHub가 예약 실행을 6~9시간씩 미뤄서(실측) 지정 시각에
# 돌지 않습니다. 목요일 장 마감 뒤로 걸어 두면 늦어도 금요일 새벽에는 끝나
# 금요일 낮에 거래할 수 있습니다. 백테스트는 주 1회(W-FRI) 리밸런싱이고,
# 목요일 종가로 뽑아 금요일에 체결하는 것이 그 간격을 가장 가깝게 지킵니다.

on:
  schedule:
    # 06:40 UTC = 15:40 KST, 목요일 (장 마감 15:30 직후)
    - cron: "40 6 * * 4"
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: "테스트용 종목 수 제한 (0 = 전체)"
        required: false
        default: "0"
      price_workers:
        description: "주가 수집 동시 요청 수 (차단되면 낮추세요)"
        required: false
        default: "6"
      tranches:
        description: "등분 수 (주간 4등분이면 4)"
        required: false
        default: "4"
      profile:
        description: "계좌 — main(상수) / alt(배우자). run_both=0일 때만 의미 있습니다"
        required: false
        default: "main"
        type: choice
        options: ["main", "alt"]
      run_both:
        description: "두 계좌 주문서를 모두 만들지 (1=둘 다, 0=profile만)"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]

concurrency:
  group: quant-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      QUANT_SMTP_USER: ${{ secrets.QUANT_SMTP_USER }}
      QUANT_SMTP_PASS: ${{ secrets.QUANT_SMTP_PASS }}
      QUANT_REPORT_EMAIL: ${{ secrets.QUANT_REPORT_EMAIL }}
      QUANT_TG_TOKEN: ${{ secrets.QUANT_TG_TOKEN }}
      QUANT_TG_CHAT_ID: ${{ secrets.QUANT_TG_CHAT_ID }}
      QUANT_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit || '0' }}
      QUANT_PRICE_WORKERS: ${{ github.event.inputs.price_workers || '6' }}
      # 총 운용금액 — 주문서에 '몇 주 살지'를 적는 데 씁니다. resync 기록이
      # 있으면 그 값을 쓰고, 없을 때의 폴백입니다.
      # 설정 > Secrets and variables > Actions > Variables 에 숫자만 넣으세요.
      QUANT_CAPITAL_KRW: ${{ vars.QUANT_CAPITAL_KRW || '0' }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 저장소 내려받기
        run: |
          mkdir -p data output
          gh release download data-store -D data -p 'kor_*.parquet' --clobber \
            || echo "저장소가 아직 없습니다 — 월간 실행을 먼저 돌려주세요."
          ls -lh data || true

      - name: 오프라인 점검 (커밋 누락 잡기)
        run: python tools/test_portfolio.py

      - name: 보유 상태 확인 (빈 상태로 주문서를 내지 않도록)
        run: |
          # 상태 파일을 못 받으면 '첫 실행'으로 오인해 이미 보유한 종목을
          # 처음부터 다시 100종목 사라는 주문서가 나옵니다. 운용을 시작한
          # 뒤에는 그게 사고이므로, 받아온 파일을 세어 보고 알려 둡니다.
          for f in kor_portfolio.parquet kor_portfolio_alt.parquet; do
            if [ -f "data/$f" ]; then
              echo "  $f 있음 ($(stat -c%s "data/$f") bytes)"
            else
              echo "::warning::data/$f 가 없습니다 — 그 계좌 주문서는 '첫 실행'으로 나옵니다. 이미 체결한 계좌라면 그대로 거래하지 마시고 먼저 확인하세요."
            fi
          done

      - name: 최신 주가 받기 (일간 실행과의 순서에 의존하지 않도록)
        continue-on-error: true
        run: python tools/refresh_kr.py

      - name: 주간 주문서 만들기
        env:
          TR: ${{ github.event.inputs.tranches || '4' }}
          PROFILE: ${{ github.event.inputs.profile || 'main' }}
          BOTH: ${{ github.event.inputs.run_both || '1' }}
        run: |
          # 두 계좌는 상태 테이블·모델 파일이 분리돼 있어 순서대로 돌리면 됩니다.
          # 한쪽이 실패해도 다른 쪽 주문서는 나와야 하므로 결과를 모아 판정합니다.
          fail=0
          if [ "$BOTH" = "1" ]; then
            targets="main alt"
          else
            targets="$PROFILE"
          fi
          for prof in $targets; do
            echo "::group::$prof 주문서"
            if python run_weekly.py -p "$prof" "$TR"; then
              echo "$prof OK"
            else
              echo "::error::$prof 주문서 생성 실패"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: 저장소·결과 올리기
        if: always()
        run: |
          shopt -s nullglob
          echo "--- output 폴더 내용 ---"
          ls -la output 2>/dev/null || echo "(output 폴더 없음)"

          gh release view data-store >/dev/null 2>&1 ||
            gh release create data-store --title "데이터 저장소" --notes "파이프라인이 관리하는 데이터입니다. 직접 수정하지 마세요."

          # data/ 는 한국·미국이 공유하므로 자기 시장 파일만.
          # output/ 는 이 실행이 만든 결과만 들어 있으므로 통째로 올린다.
          files=(data/kor_*.parquet output/*)

          echo "--- 올릴 파일 ${#files[@]}개 ---"
          for f in "${files[@]}"; do echo "  $f"; done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::올릴 파일이 하나도 없습니다"
          fi

          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            ok=0
            for try in 1 2 3; do
              if gh release upload data-store "$f" --clobber; then ok=1; break; fi
              echo "::warning::업로드 재시도 $try - $f"
              sleep $((try * 5))
            done
            if [ $ok -ne 1 ]; then
              echo "::error::업로드 실패 - $f"
              fail=1
            fi
          done

          echo "--- 릴리스에 현재 올라가 있는 파일 ---"
          gh release view data-store --json assets --jq '.assets[].name' || true
          exit $fail

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 30
          if-no-files-found: warn
