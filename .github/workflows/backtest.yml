name: 백테스트

on:
  workflow_dispatch:
    inputs:
      market:
        description: "시장"
        required: true
        default: "kr"
        type: choice
        options: ["kr", "us"]
      top_n:
        description: "보유 종목 수 (확정 100). 30은 -10.9%p, 150은 더 나빴습니다"
        required: false
        default: "100"
      rebalance:
        description: "리밸런싱 주기 — B(일간) / W-FRI(주간) / ME(월말) / QE(분기말). 확정 W-FRI"
        required: false
        default: "W-FRI"
      cost_bps:
        description: "편도 거래비용 (bp). 한국 주식은 25 안팎"
        required: false
        default: "25"
      max_sector_pct:
        description: "한 섹터 최대 비중 (0.25 = 25%). 1 이면 제한 없음. 확정 1 (모멘텀 섹터중립을 풀었으므로)"
        required: false
        default: "1"
      min_turnover:
        description: "20일 평균 거래대금 하한. 0 이면 필터 끔(예전 동작). 한국 5억 = 500000000"
        required: false
        default: "500000000"
      tranches:
        description: "분할 리밸런싱 등분 수. 1이면 매번 전체 교체. 확정 4"
        required: false
        default: "4"
      trend_ma:
        description: "리스크 오버레이 — 시장지수 이동평균 일수. 0이면 끔, 표준값 200"
        required: false
        default: "0"
      risk_off:
        description: "이동평균 아래일 때 주식비중. 0이면 전량 현금, 0.5면 절반"
        required: false
        default: "0"
      weighting:
        description: "종목별 비중 — equal(동일) / mcap(시총) / score(점수순위) / invvol(역변동성)"
        required: false
        default: "score"
        type: choice
        options: ["score", "equal", "mcap", "invvol"]
      max_weight:
        description: "한 종목 최대 비중. 0이면 방식별 기본값(mcap 8%, score·invvol 3%). 섹터상한과 혼동하지 마세요"
        required: false
        default: "0"
      rebal_band:
        description: "무매매 밴드 — 목표 비중의 ±이 비율 안이면 안 건드림. 실전과 같은 값은 0.20. 0이면 매번 되맞춤"
        required: false
        default: "0.20"
      rank_buffer:
        description: "순위 버퍼 — 상위 N위에서 사고 N×(1+버퍼)위 밖에서 매도. 0.5면 100위에서 사고 150위에서 팜. 0이면 끔"
        required: false
        default: "0.5"
      sector_neutral:
        description: "섹터 중립 — all(전부 섹터 내 비교) / no_mom(모멘텀만 전 종목 비교) / none(전부 전 종목 비교)"
        required: false
        default: "no_mom"
        type: choice
        options: ["no_mom", "all", "none"]
      use_lowvol:
        description: "저변동성 팩터 — 1이면 QVM→QVML (네 팩터 1/4씩). 낙폭을 줄이는 모델 내부 레버"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      trend_stock:
        description: "종목 단위 추세 필터 — 종목이 자기 N일선 아래면 후보 제외. 0이면 끔, 표준값 200"
        required: false
        default: "0"
      max_sector_weight:
        description: "보유 기준 섹터 비중 상한 (0.3=30%). 0이면 끔. 살 때 종목수 제한과 달리 실제로 걸립니다"
        required: false
        default: "0"
      qvm_weights:
        description: "팩터 가중치 '퀄리티,밸류,모멘텀' (예 0.25,0.5,0.25). 비우면 1/3씩"
        required: false
        default: ""
      split:
        description: "분할 '등분수/몇번째@공용비중' — 상수 2/0@0.7 · 배우자 2/1@0.7. 비우면 분할 없음"
        required: false
        default: ""

concurrency:
  group: quant-backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 내려받기
        run: |
          mkdir -p data output
          prefix=kor
          if [ "${{ github.event.inputs.market }}" = "us" ]; then prefix=global; fi
          gh release download data-store -D data -p "${prefix}_*.parquet" --clobber
          ls -lh data

      - name: 오프라인 점검 (커밋 누락 잡기)
        run: |
          python tools/test_weighting.py
          python tools/test_defaults.py

      - name: 데이터 기간 점검 (미국장만)
        if: ${{ github.event.inputs.market == 'us' }}
        run: python tools/probe_us.py

      - name: 백테스트 실행
        run: |
          python run_backtest.py \
            "${{ github.event.inputs.market }}" \
            "${{ github.event.inputs.top_n }}" \
            "${{ github.event.inputs.rebalance }}" \
            "${{ github.event.inputs.cost_bps }}" \
            "${{ github.event.inputs.max_sector_pct }}" \
            "${{ github.event.inputs.min_turnover }}" \
            "${{ github.event.inputs.tranches }}" \
            "${{ github.event.inputs.trend_ma || '0' }}" \
            "${{ github.event.inputs.risk_off || '0' }}" \
            "${{ github.event.inputs.weighting || 'equal' }}" \
            "${{ github.event.inputs.max_weight || '0' }}" \
            "${{ github.event.inputs.rebal_band || '0.20' }}" \
            "${{ github.event.inputs.rank_buffer || '0.5' }}" \
            "${{ github.event.inputs.sector_neutral || 'all' }}" \
            "${{ github.event.inputs.use_lowvol || '0' }}" \
            "${{ github.event.inputs.trend_stock || '0' }}" \
            "${{ github.event.inputs.max_sector_weight || '0' }}" \
            "${{ github.event.inputs.qvm_weights }}" \
            "${{ github.event.inputs.split }}"

      - name: 결과 올리기
        if: always()
        run: |
          shopt -s nullglob
          echo "--- output 폴더 내용 ---"
          ls -la output 2>/dev/null || echo "(output 폴더 없음)"

          # 백테스트는 읽기 전용입니다. data/ 는 절대 올리지 않습니다.
          files=(output/*)
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            ok=0
            for try in 1 2 3; do
              if gh release upload data-store "$f" --clobber; then ok=1; break; fi
              echo "::warning::업로드 재시도 $try - $f"
              sleep $((try * 5))
            done
            if [ $ok -ne 1 ]; then
              echo "::error::업로드 실패 - $f"
              fail=1
            fi
          done
          exit $fail

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.event.inputs.market }}-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 90
          if-no-files-found: warn
