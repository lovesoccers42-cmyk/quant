name: 월간 실행

on:
  schedule:
    # 00:00 UTC 매월 1일 = 09:00 KST
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      ticker_limit:
        description: "테스트용 종목 수 제한 (0 = 전체). 첫 확인은 30 정도로 해보세요"
        required: false
        default: "0"
      price_workers:
        description: "주가 수집 동시 요청 수"
        required: false
        default: "6"
      fs_workers:
        description: "재무제표 수집 동시 요청 수 (차단되면 낮추세요)"
        required: false
        default: "3"

concurrency:
  group: quant-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub Actions 무료 한도는 작업당 6시간

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      QUANT_SMTP_USER: ${{ secrets.QUANT_SMTP_USER }}
      QUANT_SMTP_PASS: ${{ secrets.QUANT_SMTP_PASS }}
      QUANT_REPORT_EMAIL: ${{ secrets.QUANT_REPORT_EMAIL }}
      QUANT_TG_TOKEN: ${{ secrets.QUANT_TG_TOKEN }}
      QUANT_TG_CHAT_ID: ${{ secrets.QUANT_TG_CHAT_ID }}
      QUANT_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit || '0' }}
      QUANT_PRICE_WORKERS: ${{ github.event.inputs.price_workers || '6' }}
      QUANT_FS_WORKERS: ${{ github.event.inputs.fs_workers || '3' }}
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 저장소 내려받기
        run: |
          mkdir -p data output
          gh release download data-store -D data --clobber \
            || echo "저장소가 아직 없습니다 — 처음부터 새로 만듭니다."
          ls -lh data || true

      - name: 월간 파이프라인 실행
        run: python run_monthly.py

      - name: 데이터 저장소 올리기
        if: always()
        run: |
          gh release view data-store >/dev/null 2>&1 \
            || gh release create data-store --title "데이터 저장소" \
                 --notes "파이프라인이 관리하는 parquet 데이터입니다. 직접 수정하지 마세요."
          if ls data/*.parquet >/dev/null 2>&1; then
            gh release upload data-store data/*.parquet --clobber
          fi

      - name: 결과 파일 올리기
        if: always()
        run: |
          shopt -s nullglob
          files=(output/*.parquet output/*.json output/*.xlsx)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload data-store "${files[@]}" --clobber
          fi

      - name: 실행 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 60
          if-no-files-found: warn
