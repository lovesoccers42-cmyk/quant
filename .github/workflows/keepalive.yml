name: 대시보드 깨워 두기

# Streamlit Community Cloud는 12시간 접속이 없으면 앱을 재웁니다. 끄는 설정은
# 없어서(공식 문서에도 없음) 주기적으로 방문해 두는 수밖에 없습니다.
#
# 쓰려면 한 번만: Settings > Secrets and variables > Actions > Variables 에
#   APP_URL = https://<앱주소>.streamlit.app
# 를 넣으세요. 변수가 없으면 이 워크플로는 조용히 아무것도 하지 않습니다.
# (Variables는 공개 레포에서도 외부에 보이지 않습니다 — 소스에 주소를 박지
#  않는 이유입니다.)
#
# 6시간마다 도는 이유: GitHub가 예약 실행을 6~9시간 미루고(이 레포 실측)
# 혼잡할 때는 아예 건너뛰기도 합니다. 8시간 간격이면 한 번 밀리거나 빠질 때
# 12시간을 넘겨 잠들어 버립니다. 6시간이면 한 번 빠져도 여유가 있습니다.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 주소 확인
        id: cfg
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "::notice::APP_URL 변수가 없습니다 — 건너뜁니다."
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.go == '1'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.go == '1'
        with:
          python-version: "3.11"

      - name: 브라우저 준비
        if: steps.cfg.outputs.go == '1'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 방문 (웹소켓이 붙어야 '접속'으로 인정됩니다)
        if: steps.cfg.outputs.go == '1'
        env:
          URL: ${{ vars.APP_URL }}
        run: python tools/keep_awake.py "$URL"
